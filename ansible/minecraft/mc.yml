---
- name: Minecraft PaperMC szerver telepitese Debianra
  hosts: minecraft-vm
  become: yes
  vars:
    mc_user: "minecraft"
    mc_dir: "/opt/minecraft"
    ram_min: "2G"
    ram_max: "4G"
    rcon_port: 25575
    paper_url: "https://fill-data.papermc.io/v1/objects/0e824dffed28a61ae716ed3991f291b9ed594e0446262ea8c178a17c8dbb82ba/paper-26.2-91.jar"
    rcon_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  tasks:
    - name: Csomagok frissitese es Java 25 telepitese
      apt:
        name:
          - openjdk-25-jre-headless
          - screen
          - curl
          - wget
          - ufw
          - git
          - build-essential
        state: present
        update_cache: yes
    
    - name: allow ssh port
      community.general.ufw:
        rule: allow
        port: ssh

    - name: allow mc port (Minecraft)
      community.general.ufw:
        rule: allow
        port: '25565'
    
    - name: UFW tuzfal bekapcsolasa
      community.general.ufw:
        state: enabled
        policy: deny
    

    - name: Minecraft szerver felhasznalo letrehozasa
      user:
        name: "{{ mc_user }}"
        shell: /bin/bash
        home: "{{ mc_dir }}"

    - name: Szerver mappa letrehozasa
      file:
        path: "{{ mc_dir }}"
        state: directory
        owner: "{{ mc_user }}"
        group: "{{ mc_user }}"
        mode: '0755'

    - name: PaperMC jar letoltese
      get_url:
        url: "{{ paper_url }}"
        dest: "{{ mc_dir }}/paper.jar"
        owner: "{{ mc_user }}"
        group: "{{ mc_user }}"
        mode: '0644'

    - name: EULA elfogadasa
      copy:
        dest: "{{ mc_dir }}/eula.txt"
        content: "eula=true\n"
        owner: "{{ mc_user }}"
        group: "{{ mc_user }}"
        mode: '0644'
    
    - name: Whitelist bekapcsolasa a server.properties fajlban
      lineinfile:
        path: "{{ mc_dir }}/server.properties"
        regexp: '^white-list='
        line: 'white-list=true'
        create: yes
        owner: "{{ mc_user }}"
        group: "{{ mc_user }}"
        mode: '0644'


    - name: Systemd szerviz fajl letrehozasa
      copy:
        dest: /etc/systemd/system/minecraft.service
        content: |
          [Unit]
          Description=Minecraft PaperMC Szerver
          After=network.target

          [Service]
          User={{ mc_user }}
          WorkingDirectory={{ mc_dir }}
          ExecStart=/usr/bin/java -Xms{{ ram_min }} -Xmx{{ ram_max }} -jar paper.jar nogui
          ExecStop=/bin/kill -15 $MAINPID
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Clone mcrcon
      git:
        repo: https://github.com/Tiiffi/mcrcon.git
        dest: /tmp/mcrcon

    - name: Build mcrcon
      command:
        cmd: make
        chdir: /tmp/mcrcon
        creates: /tmp/mcrcon/mcrcon

    - name: Install mcrcon
      copy:
        src: /tmp/mcrcon/mcrcon
        dest: /usr/local/bin/mcrcon
        mode: '0755'
        remote_src: true

    - name: Enable RCON
      lineinfile:
        path: "{{ mc_dir }}/server.properties"
        regexp: '^enable-rcon='
        line: 'enable-rcon=true'
        create: yes

    - name: Set RCON port
      lineinfile:
        path: "{{ mc_dir }}/server.properties"
        regexp: '^rcon.port='
        line: "rcon.port={{ rcon_port }}"

    - name: Set RCON password
      lineinfile:
        path: "{{ mc_dir }}/server.properties"
        regexp: '^rcon.password='
        line: "rcon.password={{ rcon_password }}"


    - name: Minecraft szerviz inditasa es engedelyezese
      systemd:
        name: minecraft
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Store RCON credentials
      copy:
        dest: /etc/minecraft-rcon.conf
        owner: root
        group: root
        mode: '0600'
        content: |
          RCON_HOST=127.0.0.1
          RCON_PORT={{ rcon_port }}
          RCON_PASSWORD={{ rcon_password }}

    - name: Store RCON credentials
      copy:
        dest: /etc/minecraft-rcon.conf
        owner: root
        group: root
        mode: '0600'
        content: |
          RCON_HOST=127.0.0.1
          RCON_PORT={{ rcon_port }}
          RCON_PASSWORD={{ rcon_password }}

    - name: Restart Minecraft
      systemd:
        name: minecraft
        state: restarted

    